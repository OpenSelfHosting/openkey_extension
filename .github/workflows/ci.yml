name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Crypto interop
        run: npm run test:interop
      - name: Passkey smoke
        run: npm run test:passkey
      - name: Build
        run: npm run build
