<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenKey</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div id="app">
      <section id="lockedView">
        <div class="auth-hero">
          <div class="auth-morph" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="52" height="52" fill="currentColor">
              <path
                d="M2 17h20v2H2v-2zm1.15-4.05L4 11.47l.85 1.48 1.3-.75-.85-1.48H7v-1.5H5.3l.85-1.47L4.85 7 4 8.47 3.15 7l-1.3.75.85 1.47H1v1.5h1.7l-.85 1.48 1.3.75zm6.7-.75l1.3.75.85-1.48H14v-1.5h-1.7l.85-1.47L11.85 7 11 8.47 10.15 7l-1.3.75.85 1.47H8v1.5h1.7l-.85 1.48 1.3.75zM23 9.22h-1.7l.85-1.47L20.85 7 20 8.47 19.15 7l-1.3.75.85 1.47H17v1.5h1.7l-.85 1.48 1.3.75.85-1.48.85 1.48 1.3-.75-.85-1.48H23v-1.5z"
              />
            </svg>
          </div>
          <h1><span class="brand-open">Open</span><span class="brand-key">Key</span></h1>
        </div>
        <p class="hero-sub" id="heroSub">
          Unlock your vault or connect the desktop app.
        </p>

        <div class="mode-switch" role="tablist">
          <button type="button" class="mode active" data-mode="unlock" id="modeUnlock">
            Unlock
          </button>
          <button type="button" class="mode" data-mode="register" id="modeRegister">
            Create account
          </button>
        </div>

        <label>
          Self-hosted server
          <input
            id="serverUrl"
            type="url"
            placeholder="http://localhost:8000"
            autocomplete="url"
          />
        </label>
        <label>
          Email
          <input id="email" type="email" autocomplete="username" />
        </label>
        <label>
          Master password
          <input id="password" type="password" autocomplete="current-password" />
        </label>
        <label id="confirmWrap" hidden>
          Confirm password
          <input id="confirm" type="password" autocomplete="new-password" />
        </label>

        <button id="unlockBtn" type="button" class="auth-cta">UNLOCK</button>
        <button id="registerBtn" type="button" class="auth-cta" hidden>CREATE ACCOUNT</button>

        <div class="divider"><span>or</span></div>
        <button id="nativeBtn" type="button" class="secondary">Use desktop app</button>
        <div class="ext-id-row" id="extIdRow">
          <p class="hint" id="extIdHint">
            If Connect fails, paste this ID in OpenKey → Settings → Browser extension.
          </p>
          <div class="ext-id-box">
            <code id="extIdValue"></code>
            <button type="button" class="ghost" id="copyExtIdBtn">Copy ID</button>
          </div>
        </div>
        <p id="error" class="error"></p>
      </section>

      <section id="unlockedView" hidden>
        <div class="shell">
          <div class="page-header" id="pageHeader">
            <button
              type="button"
              class="icon-btn leading-btn"
              id="leadingBtn"
              hidden
              title="Back"
              aria-label="Back"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
              </svg>
            </button>
            <h2 id="pageTitle">Vault</h2>
            <div class="page-actions" id="pageActions">
              <button
                type="button"
                class="icon-btn"
                id="searchToggle"
                title="Search"
                aria-label="Search"
              >
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                  <path
                    d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                  />
                </svg>
              </button>
              <button
                type="button"
                class="icon-btn"
                id="shareToggle"
                hidden
                title="Share"
                aria-label="Share"
              >
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                  <path
                    d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="search-bar" id="searchBar" hidden>
            <button
              type="button"
              class="icon-btn"
              id="searchBack"
              title="Back"
              aria-label="Close search"
            >
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
              </svg>
            </button>
            <input id="search" type="search" placeholder="Search passwords" autocomplete="off" />
          </div>

          <div class="page-body" id="pageBody">
            <div id="filterBar" class="filter-bar" hidden></div>
            <ul id="list" class="action-list"></ul>
            <div id="cardsGrid" class="cards-grid" hidden></div>
            <div id="settingsPanel" class="settings-panel" hidden></div>
            <div id="subPanel" class="sub-panel" hidden></div>
            <div id="detailPage" class="detail-page-host" hidden></div>
          </div>

          <button type="button" class="fab" id="fabBtn" hidden title="Add" aria-label="Add">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
          </button>

          <p id="genOut" class="status-line" hidden aria-hidden="true"></p>
        </div>

        <nav class="me-nav" id="bottomNav" aria-label="Main">
          <div class="me-nav-indicator" id="navIndicator" aria-hidden="true"></div>
          <button type="button" class="me-nav-item active" data-tab="vault">
            <span class="me-nav-icon">
              <svg class="icon-outline" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path
                  d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10z"
                />
              </svg>
            </span>
            <span class="me-nav-label">Vault</span>
          </button>
          <button type="button" class="me-nav-item" data-tab="items">
            <span class="me-nav-icon">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path
                  d="M3 3v8h8V3H3zm6 6H5V5h4v4zm-6 4v8h8v-8H3zm6 6H5v-4h4v4zm4-16v8h8V3h-8zm6 6h-4V5h4v4zm-6 4v8h8v-8h-8zm6 6h-4v-4h4v4z"
                />
              </svg>
            </span>
            <span class="me-nav-label">Items</span>
          </button>
          <button type="button" class="me-nav-item" data-tab="settings">
            <span class="me-nav-icon">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path
                  d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"
                />
              </svg>
            </span>
            <span class="me-nav-label">Settings</span>
          </button>
        </nav>
      </section>
    </div>

    <div id="toastHost" aria-live="polite" aria-atomic="true"></div>
    <div id="loadingOverlay" aria-hidden="true">
      <div class="me-loader" role="status" aria-label="Loading">
        <div class="me-loader-dot"></div>
      </div>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
